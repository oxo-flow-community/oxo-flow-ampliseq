# Upstream SUMMARY_REPORT env — the module's exact conda pin set
# (modules/nf-core/ampliseq/summary_report/main.nf in nf-core/ampliseq
# 2.18.0). r-lubridate is not in the upstream pin list but ships inside the
# upstream container; rendered template code calls base R only, so it is
# omitted here.
# Channel NAMES only (no mirror URLs): CN users point their conda config
# at a domestic mirror, international users use the defaults.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - conda-forge::r-base=4.2.3
  - conda-forge::r-rmarkdown=2.22
  - conda-forge::r-tidyverse=2.0.0
  - conda-forge::r-knitr=1.43
  - conda-forge::r-dt=0.28
  - conda-forge::r-dtplyr=1.3.1
  - conda-forge::r-formattable=0.2.1
  - conda-forge::r-purrr=1.0.1
  - conda-forge::r-vegan=2.6_4
  - conda-forge::r-optparse=1.7.3
  - conda-forge::r-ggplot2=3.4.2
  - conda-forge::r-dplyr=1.1.2
  - conda-forge::r-data.table=1.14.8
  - conda-forge::r-patchwork=1.1.2
